name: Secret Scan (TruffleHog)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  trufflehog-strict:
    # Diff scan only. workflow_dispatch runs the full-history job below so the
    # nightly configuration can be checked without waiting for the cron.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run TruffleHog (PR/push — no path excludes)
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          # Pin the CLI image to match the action; the input defaults to "latest".
          version: 3.96.0
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          extra_args: --results=verified,unknown

  trufflehog-scheduled:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Full-tree scan (no base/head — schedule has no valid git range).
      # Excludes example/placeholder paths; PR/push strict job has no excludes.
      - name: Run TruffleHog (schedule — example paths excluded)
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          # Pin the CLI image to match the action; the input defaults to "latest".
          version: 3.96.0
          path: ./
          extra_args: --results=verified,unknown --exclude-paths=config/trufflehog-exclude.txt
