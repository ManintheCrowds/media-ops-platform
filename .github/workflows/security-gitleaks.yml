name: Secret Scan (Gitleaks)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Fetch gate revision
        env:
          GATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "${GATE_SHA}" ] || [ "${GATE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            echo "missing revision" >&2
            exit 2
          fi
          git fetch --no-tags origin "${GATE_SHA}"
          git cat-file -e "${GATE_SHA}^{commit}"

      - name: Install gitleaks 8.30.1
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /usr/local/bin/gitleaks" | sha256sum -c -

      - name: Materialize base scan gate
        env:
          GATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/scan"
          BOOTSTRAP_SHA="f3559cbb2677eb72088bec7c56d541f0aa78a41e"
          if git cat-file -e "${GATE_SHA}:.github/scripts/gitleaks_ci.py" 2>/dev/null; then
            git show "${GATE_SHA}:.github/scripts/gitleaks_ci.py" > "${RUNNER_TEMP}/scan/gitleaks_ci.py"
          elif [ "${GATE_SHA}" = "${BOOTSTRAP_SHA}" ]; then
            echo "bootstrap: base has no scan script"
            cp .github/scripts/gitleaks_ci.py "${RUNNER_TEMP}/scan/gitleaks_ci.py"
          else
            echo "missing revision" >&2
            exit 2
          fi
          git show "${GATE_SHA}:.gitleaks.toml" > "${RUNNER_TEMP}/scan/.gitleaks.toml"
          if git cat-file -e "${GATE_SHA}:.gitleaksignore" 2>/dev/null; then
            git show "${GATE_SHA}:.gitleaksignore" > "${RUNNER_TEMP}/scan/.gitleaksignore"
          else
            : > "${RUNNER_TEMP}/scan/.gitleaksignore"
          fi
          if git cat-file -e "${GATE_SHA}:.github/trufflehog-known-findings.json" 2>/dev/null; then
            git show "${GATE_SHA}:.github/trufflehog-known-findings.json" > "${RUNNER_TEMP}/scan/trufflehog-known-findings.json"
          fi

      - name: Run gitleaks
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          unset GITLEAKS_BIN
          unset GITLEAKS_CONFIG
          unset GITLEAKS_CONFIG_TOML
          export PATH="/usr/bin:/bin"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /usr/local/bin/gitleaks" | sha256sum -c -
          /usr/local/bin/gitleaks version
          python3 "${RUNNER_TEMP}/scan/gitleaks_ci.py"

  gitleaks-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Install gitleaks 8.30.1
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Gitleaks tests
        run: |
          python3 -m pip install --user pytest==9.1.1
          python3 -m pytest -o addopts= --noconftest tests/security -q
