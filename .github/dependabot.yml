# PURPOSE: Cap Dependabot PR volume and group related bumps.
# MODIFICATION NOTES: 2026-07-10 triage — open-pull-requests-limit + groups
#   after 38 stale conflicting PRs piled up.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      test:
        patterns:
          - "pytest*"
          - "respx"
          - "faker"
          - "coverage"
      http:
        patterns:
          - "httpx"
          - "requests"
          - "aiohttp"
          - "urllib3"
      web:
        patterns:
          - "fastapi"
          - "uvicorn*"
          - "starlette"
          - "python-multipart"
          - "jinja2"
          - "pydantic*"

  - package-ecosystem: "pip"
